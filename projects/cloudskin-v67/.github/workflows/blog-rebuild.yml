name: blog-rebuild

# Rebuild + deploy the CloudSkin Journal when a writer publishes in WordPress.
#
# Chain: WordPress publish -> cloudskin-rebuild mu-plugin -> Supabase edge fn
#        `blog-rebuild` -> repository_dispatch (event "blog-publish") -> THIS job.
# It regenerates the static /blog pages from live WordPress, translates them
# (cache-aware, English + Arabic), commits the translation cache back so it
# persists across cloud rebuilds, then deploys to Vercel with the team token.
#
# Deploys stay GATE-PRESERVING: scripts/deploy.mjs ships the committed HTML as-is,
# so the store's access gate + noindex + robots Disallow remain until the separate
# public-launch toggle. Vercel push-auto-deploy stays OFF; this token deploy is the
# only thing that ships, so the cache commit below never triggers a second build.

on:
  repository_dispatch:
    types: [blog-publish]
  workflow_dispatch: {}   # manual "Run workflow" button in the Actions tab

# A burst of publishes collapses into one build: a newer run cancels the in-flight one.
concurrency:
  group: blog-rebuild
  cancel-in-progress: true

permissions:
  contents: write   # commit the refreshed translation cache back to the repo

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # gen-blog + translate + deploy. deploy.mjs re-bakes the content snapshot and
      # first-paint HTML from live Supabase, regenerates /blog from live WordPress
      # (translating new/changed posts only, thanks to blog/i18n-cache), then deploys.
      # VERCEL_TOKEN is a TEAM-authored deploy token, which bypasses the git-author
      # block; VERCEL_ORG_ID / VERCEL_PROJECT_ID stand in for the gitignored
      # .vercel/project.json. Translation is off automatically if ANTHROPIC_API_KEY
      # is absent (English-only build) — the pipeline never hard-fails on a missing key.
      - name: Rebuild blog, translate, deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_ENGINE: ${{ vars.TRANSLATE_ENGINE || 'claude' }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL || 'claude-haiku-4-5' }}
          BLOG_LANGS: ${{ vars.BLOG_LANGS || 'ar' }}
        run: node scripts/deploy.mjs

      # Persist the translation cache (and regenerated pages) so the next cloud
      # rebuild reuses them instead of paying to re-translate. Runs even if the
      # deploy step failed, so already-spent translation work is never lost.
      - name: Persist translation cache
        if: always()
        run: |
          git config user.name "cloudskin-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/ || true
          if git diff --cached --quiet; then
            echo "No blog cache/page changes to commit."
            exit 0
          fi
          git commit -m "chore(blog): refresh translation cache + generated pages [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Cache pushed."
              exit 0
            fi
            echo "push attempt $i failed, retrying in 3s..."
            sleep 3
          done
          echo "::warning::could not push the refreshed translation cache after 3 tries (deploy still succeeded)."

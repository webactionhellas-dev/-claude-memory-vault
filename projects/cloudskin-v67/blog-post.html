       <script> line AND flip the robots meta below to index,follow to make posts public. -->
  <script>(function(){try{if(sessionStorage.getItem('cs_gate_ok')==='1')return;}catch(e){return;}location.replace('/');})();</script>
  <!-- GEN-BLOG:HEAD:START -->
  <!-- Per-post SEO (title / description / canonical / Open Graph / Twitter / JSON-LD Article).
       In GENERATED post files this whole block (up to GEN-BLOG:HEAD:END) is replaced by
       scripts/gen-blog.mjs with baked per-post tags. Here in the template it is the client-side
       fallback default (js/blog.js fills it at runtime for slugs served before the next build). -->
  <title>The Journal | CLOUDSKIN®</title>
  <meta name="description" content="Stories from the CloudSkin world, from the court to everywhere after.">

  <meta property="og:site_name" content="CLOUDSKIN">
  <meta property="og:title" content="The CloudSkin Journal">
  <meta property="og:description" content="Stories from the CloudSkin world, from the court to everywhere after.">
  <meta property="og:url" content="https://www.cloudskin.com/blog">
  <meta property="og:image" content="https://www.cloudskin.com/img/brand/og-image.jpg">

  <meta name="twitter:site" content="@cloudskin.active">
  <!-- GEN-BLOG:HEAD:END -->

    <!-- the article is rendered here by js/blog.js from the post slug in the URL -->

        <div class="jskel__l" style="max-width:360px;height:34px;margin:0 auto"></div>

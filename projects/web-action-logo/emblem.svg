<svg width="220" height="220" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="W&A — Web Action, Web & App Development">
  <defs>
    <radialGradient id="navy" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#16264f"/>
      <stop offset="1" stop-color="#0A1330"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#navy)"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#F4F2EA" stroke-opacity="0.30" stroke-width="1.1"/>
  <circle cx="100" cy="100" r="88.5" fill="none" stroke="#F4F2EA" stroke-opacity="0.12" stroke-width="0.8"/>

  <!-- W&A monogram -->
  <text x="100" y="98" text-anchor="middle" fill="#F4F2EA"
        font-family="'Cormorant Garamond', Georgia, serif" font-weight="600" font-size="70" letter-spacing="-3">WA</text>

  <!-- WEB ACTION with flanking rules -->
  <line x1="46" y1="120" x2="66" y2="120" stroke="#F4F2EA" stroke-opacity="0.55" stroke-width="1"/>
  <line x1="134" y1="120" x2="154" y2="120" stroke="#F4F2EA" stroke-opacity="0.55" stroke-width="1"/>
  <text x="100" y="124.5" text-anchor="middle" fill="#F4F2EA"
        font-family="'Jost', 'Segoe UI', sans-serif" font-weight="500" font-size="12.5" letter-spacing="5.5">WEB ACTION</text>

  <!-- tagline -->
  <text x="100.5" y="143" text-anchor="middle" fill="#F4F2EA" fill-opacity="0.78"
        font-family="'Jost', 'Segoe UI', sans-serif" font-weight="400" font-size="6.6" letter-spacing="3.2">WEB &amp; APP DEVELOPMENT</text>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>DRIP — Luxury Sneakers & Streetwear in Athens</title>
<meta name="description" content="DRIP — Athens' home for authenticated luxury sneakers and streetwear. Single-file build.">
<meta name="theme-color" content="#050505">
<style>/*__FONTS__*/</style>
<style>/*__SITECSS__*/</style>
<style>
/* ===== single-file homepage styles ===== */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.sec{position:relative;z-index:2;padding:54px 0}
@media(min-width:768px){.sec{padding:78px 0}}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px}
.sec-head h2{font-family:var(--font-display);text-transform:uppercase;font-weight:800;font-size:clamp(26px,4.4vw,46px);line-height:.98;letter-spacing:-.01em;margin:0}
.sec-head .eyebrow{margin-bottom:10px}
.sec-head a.more{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;display:inline-flex;gap:7px;align-items:center;transition:.2s}
.sec-head a.more:hover{color:var(--accent)}
.sec-head a.more svg{width:14px;height:14px;flex:none}
.btn-fill svg,.btn-line svg{width:15px;height:15px;flex:none}
.hero{position:relative;z-index:2;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1fr;gap:30px;align-items:center;padding:38px 0 18px}
@media(min-width:940px){.hero-grid{grid-template-columns:1.02fr .98fr;gap:40px;padding:54px 0 30px;min-height:74vh}}
.hero-copy{position:relative;z-index:3}
.hero-tag{display:inline-flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(0,229,255,.32);background:rgba(0,229,255,.06);padding:7px 14px;border-radius:999px;margin-bottom:22px}
.hero-tag i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero h1{font-family:var(--font-display);text-transform:uppercase;font-weight:800;font-size:clamp(44px,8.4vw,100px);line-height:.86;letter-spacing:-.02em;margin:0}
.hero h1 .out{-webkit-text-stroke:1.4px rgba(255,255,255,.55);color:transparent}
.hero h1 .accent{color:var(--accent)}
.hero p.lead{margin:24px 0 0;color:var(--muted);font-size:16px;line-height:1.6;max-width:480px}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}
.btn-fill{height:56px;padding:0 30px;border-radius:14px;background:var(--accent);color:#04181c;font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;display:inline-flex;align-items:center;gap:9px;border:none;transition:.2s;cursor:pointer}
.btn-fill:hover{box-shadow:0 0 40px -6px rgba(0,229,255,.7);transform:translateY(-2px)}
.btn-line{height:56px;padding:0 28px;border-radius:14px;background:transparent;border:1px solid var(--hairline);color:#fff;font-weight:600;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;display:inline-flex;align-items:center;gap:9px;transition:.2s}
.btn-line:hover{border-color:#fff;background:rgba(255,255,255,.04)}
.hero-stats{display:flex;gap:30px;margin-top:38px;flex-wrap:wrap}
.hero-stats div b{font-family:var(--font-display);font-size:26px;display:block;line-height:1}
.hero-stats div span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
/* hero single-sneaker auto-rotating slideshow (transparent cutouts, no white box, no shadow) */
.hero-stage{position:relative;aspect-ratio:1/1;max-width:600px;margin:0 auto;width:100%;display:grid;place-items:center}
.hero-stage .glow{position:absolute;inset:7%;border-radius:50%;background:radial-gradient(circle at 50% 47%,rgba(0,229,255,.30),rgba(0,229,255,.07) 46%,transparent 64%);filter:blur(38px);z-index:0}
.hero-stage .ring{position:absolute;inset:3%;border-radius:50%;border:1px solid rgba(255,255,255,.07);z-index:0}
.hero-stage .ring.r2{inset:-5%;border-color:rgba(255,255,255,.04)}
.hero-slides{position:absolute;inset:10%;z-index:2}
.hero-slide{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.9) rotate(-2deg);transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.hero-slide.on{opacity:1;transform:none;pointer-events:auto}
.hero-slide img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;animation:heroFloat 6s ease-in-out infinite}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@media(prefers-reduced-motion:reduce){.hero-slide img{animation:none}}
.hero-cap{position:absolute;top:1%;left:1%;z-index:4;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);display:flex;gap:8px;align-items:center}
.hero-cap::before{content:"";width:18px;height:1px;background:var(--accent)}
.hero-label{position:absolute;left:0;bottom:1%;z-index:4;backdrop-filter:blur(10px);background:rgba(10,10,12,.62);border:1px solid var(--hairline);border-radius:14px;padding:11px 16px;display:flex;align-items:center;gap:12px;max-width:78%}
.hero-label .nm{font-size:13.5px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.hero-label .br{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.14em}
.hero-label .pr{margin-left:4px;font-size:14px;font-weight:700;color:var(--accent);white-space:nowrap}
.hero-dots{position:absolute;right:2%;bottom:4%;z-index:4;display:flex;gap:7px}
.hero-dots button{width:8px;height:8px;border-radius:50%;border:none;background:rgba(255,255,255,.28);transition:.25s;cursor:pointer;padding:0}
.hero-dots button.on{background:var(--accent);width:22px;border-radius:5px}
.marquee{position:relative;z-index:2;border-block:1px solid var(--hairline-2);overflow:hidden;padding:18px 0;background:#070708}
.marquee .track{display:flex;gap:54px;white-space:nowrap;width:max-content;animation:scrollx 38s linear infinite}
.marquee span{font-family:var(--font-display);text-transform:uppercase;font-size:22px;font-weight:800;color:rgba(255,255,255,.16);display:inline-flex;align-items:center;gap:54px}
.marquee span::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
@keyframes scrollx{to{transform:translateX(-50%)}}
.trust-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--hairline-2);border:1px solid var(--hairline-2);border-radius:18px;overflow:hidden}
@media(min-width:760px){.trust-strip{grid-template-columns:repeat(4,1fr)}}
.trust-strip .t{background:#08080a;padding:24px 20px;display:flex;gap:13px;align-items:center}
.trust-strip .t svg{width:24px;height:24px;color:var(--accent);flex:none}
.trust-strip .t b{display:block;font-size:13.5px}.trust-strip .t span{font-size:12px;color:var(--faint)}
.brand-rail{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:560px){.brand-rail{grid-template-columns:repeat(3,1fr)}}
@media(min-width:980px){.brand-rail{grid-template-columns:repeat(6,1fr)}}
.brand-tile{position:relative;aspect-ratio:1/1;border-radius:16px;border:1px solid var(--hairline);overflow:hidden;background:radial-gradient(120% 120% at 50% 30%,#fff,#e9e9ea);display:grid;place-items:center;transition:.3s}
.brand-tile img{width:74%;height:74%;object-fit:contain;mix-blend-mode:multiply;transition:transform .5s}
.brand-tile:hover{border-color:rgba(0,229,255,.4);box-shadow:0 24px 60px -34px rgba(0,0,0,.9)}
.brand-tile:hover img{transform:scale(1.07)}
.brand-tile .bn{position:absolute;left:0;right:0;bottom:0;padding:10px;text-align:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.62))}
.rail{display:flex;gap:18px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 70%;scroll-snap-align:start}
@media(min-width:560px){.rail .card{flex-basis:40%}}
@media(min-width:980px){.rail .card{flex-basis:23%}}
.drop{position:relative;z-index:2;border-radius:26px;overflow:hidden;border:1px solid var(--hairline);display:grid;grid-template-columns:1fr;background:linear-gradient(120deg,#0a0a0c,#101417)}
@media(min-width:860px){.drop{grid-template-columns:1.1fr .9fr}}
.drop .d-img{position:relative;aspect-ratio:16/11;background:radial-gradient(120% 120% at 50% 30%,#fff,#e6e6e8)}
.drop .d-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:7%;mix-blend-mode:multiply}
.drop .d-copy{padding:34px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.drop .d-copy .eyebrow{color:var(--accent)}
.drop .d-copy h3{font-family:var(--font-display);text-transform:uppercase;font-size:clamp(26px,3.4vw,40px);line-height:.98;margin:0}
.drop .d-copy p{color:var(--muted);font-size:14.5px;line-height:1.65;margin:0;max-width:440px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.drop .d-price{display:flex;align-items:baseline;gap:12px;margin-top:4px}
.drop .d-price .p{font-size:26px;font-weight:700}.drop .d-price .c{color:var(--faint);text-decoration:line-through}
.news{position:relative;z-index:2;border-radius:26px;border:1px solid var(--hairline);overflow:hidden;text-align:center;padding:56px 24px;background:radial-gradient(120% 160% at 50% 0%,rgba(0,229,255,.10),transparent 60%),#08080a}
.news h2{font-family:var(--font-display);text-transform:uppercase;font-size:clamp(28px,4.5vw,52px);margin:0 0 10px;line-height:.98}
.news p{color:var(--muted);max-width:440px;margin:0 auto 26px}
.news form{display:flex;gap:10px;max-width:460px;margin:0 auto;flex-wrap:wrap}
.news input{flex:1;min-width:200px;height:54px;border-radius:13px;background:var(--glass);border:1px solid var(--hairline);color:#fff;padding:0 18px;font-size:14px;outline:none}
.news input:focus{border-color:var(--accent)}
</style>
</head>
<body>
<div class="bg-orb a"></div><div class="bg-orb b"></div>
<div id="hdr"></div>
<main id="app"></main>
<div id="ftr"></div>

<script>
const DATA = /*__DATA__*/[];
const META = /*__META__*/{brands:[]};
const SHOWCASE = /*__SHOWCASE__*/[];
const LOGO = "__LOGO__";
</script>
<script>
const DRIP = (() => {
  const money = n => new Intl.NumberFormat('el-GR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
  const products = () => DATA;
  const esc = s => (s||'').replace(/"/g,'&quot;');
  /* cart */
  const CART_KEY='drip_cart_single';
  const cart={
    get(){try{return JSON.parse(localStorage.getItem(CART_KEY))||[]}catch(e){return[]}},
    set(v){try{localStorage.setItem(CART_KEY,JSON.stringify(v))}catch(e){} paintCount();},
    add(it){const c=cart.get();const k=it.slug+'|'+it.size;const ex=c.find(x=>x.slug+'|'+x.size===k);if(ex)ex.qty+=it.qty||1;else c.push({...it,qty:it.qty||1});cart.set(c);renderDrawer();openDrawer();},
    remove(k){cart.set(cart.get().filter(x=>x.slug+'|'+x.size!==k));renderDrawer();},
    count(){return cart.get().reduce((n,x)=>n+x.qty,0)},
    total(){return cart.get().reduce((n,x)=>n+x.price*x.qty,0)},
  };
  function paintCount(){document.querySelectorAll('.cart-count').forEach(e=>{const n=cart.count();e.textContent=n;e.dataset.n=n;});}
  const NAV=[['Home','#/'],['Shop','#/shop'],['Brands','#/shop?view=brands'],['New Arrivals','#/shop?c=new-arrivals'],['Sale','#/shop?c=sale','sale']];
  function icon(n){const I={search:'<path d="M21 21l-4.3-4.3M11 19a8 8 0 100-16 8 8 0 000 16z"/>',bag:'<path d="M6 7h12l1 14H5L6 7z"/><path d="M9 7a3 3 0 016 0"/>',heart:'<path d="M12 21s-7-4.5-9.5-9A5 5 0 0112 5a5 5 0 019.5 7C19 16.5 12 21 12 21z"/>',close:'<path d="M6 6l12 12M18 6L6 18"/>',truck:'<path d="M3 7h11v8H3zM14 10h4l3 3v2h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'};return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+(I[n]||'')+'</svg>';}
  function header(active){
    const links=NAV.map(([l,h,c])=>`<a href="${h}" class="${c||''} ${active===l?'active':''}">${l}</a>`).join('');
    const ml=NAV.map(([l,h])=>`<a href="${h}" class="${active===l?'active':''}">${l}</a>`).join('');
    return `<div class="announce">Free express shipping · 24h delivery in Athens · 100% authenticated</div>
      <header class="site-header glass"><div class="wrap"><div class="bar">
      <a class="brand" href="#/" aria-label="DRIP home"><img src="${LOGO}" alt="DRIP"></a>
      <nav class="nav">${links}</nav>
      <div class="hicons">
        <button class="iconbtn" aria-label="Search" onclick="DRIP.toggleSearch()">${icon('search')}</button>
        <button class="iconbtn" aria-label="Cart" onclick="DRIP.openDrawer()">${icon('bag')}<span class="cart-count" data-n="0"></span></button>
      </div></div><div class="mnav">${ml}</div></div></header>`;
  }
  function footer(){
    const col=(h,items)=>`<div><h5>${h}</h5>${items.map(i=>`<a href="${i[1]}">${i[0]}</a>`).join('')}</div>`;
    return `<footer class="site-footer"><div class="wrap"><div class="foot-grid">
      <div><a href="#/"><img class="foot-logo" src="${LOGO}" alt="DRIP"></a>
        <p class="muted" style="max-width:300px;margin-top:18px;font-size:13.5px;line-height:1.7">Athens' home for authenticated grails. Every pair inspected by hand, sealed, and at your door in 24 hours. We don't sell sneakers — we move culture.</p></div>
      ${col('Shop',[['All Sneakers','#/shop'],['New Arrivals','#/shop?c=new-arrivals'],['Best Sellers','#/shop?c=featured'],['Sale','#/shop?c=sale']])}
      ${col('Brands',[['Air Jordan','#/shop?brand=Jordan'],['Nike','#/shop?brand=Nike'],['Yeezy','#/shop?brand=Yeezy'],['New Balance','#/shop?brand=New Balance']])}
      ${col('Help',[['Shipping','#/'],['Returns','#/'],['Authenticity','#/'],['Contact','#/']])}
    </div><div class="foot-bottom"><span>© ${new Date().getFullYear()} DRIP — Kifisia, Athens · Authenticated luxury sneakers &amp; streetwear</span><span>Visa · Mastercard · Apple&nbsp;Pay · Klarna · Prices in&nbsp;€&nbsp;EUR</span></div></div></footer>`;
  }
  function drawerEl(){let m=document.getElementById('drip-drawer');if(m)return m;const w=document.createElement('div');
    w.innerHTML=`<div class="drawer-mask" id="drip-mask" onclick="DRIP.closeDrawer()"></div><aside class="drawer" id="drip-drawer"><div class="dhead"><h3>Your Bag</h3><button class="iconbtn" onclick="DRIP.closeDrawer()">${icon('close')}</button></div><div class="ditems" id="drip-ditems"></div><div class="dfoot" id="drip-dfoot"></div></aside>`;
    document.body.appendChild(w);return document.getElementById('drip-drawer');}
  function renderDrawer(){drawerEl();const items=cart.get();const box=document.getElementById('drip-ditems');const foot=document.getElementById('drip-dfoot');
    if(!items.length){box.innerHTML=`<div class="dempty">Your bag is empty.<br><br><a class="btn-load" style="display:inline-block;line-height:50px" href="#/shop" onclick="DRIP.closeDrawer()">Start shopping</a></div>`;foot.innerHTML='';return;}
    box.innerHTML=items.map(x=>{const k=x.slug+'|'+x.size;return `<div class="citem"><a href="#/product/${x.slug}" onclick="DRIP.closeDrawer()"><img src="${x.image}" alt=""></a><div style="flex:1"><div class="ci-name">${x.name}</div><div class="ci-meta">${x.brand} · Size ${x.size} · Qty ${x.qty}</div><div class="ci-price">${money(x.price*x.qty)}</div></div><button class="ci-rm" onclick="DRIP.cart.remove('${k.replace(/'/g,"\\'")}')">Remove</button></div>`}).join('');
    foot.innerHTML=`<div class="row"><span class="muted">Subtotal</span><b>${money(cart.total())}</b></div><button class="btn-primary" style="width:100%" onclick="DRIP.toast('Checkout is a demo on this build ✦')">Checkout</button><p class="muted" style="text-align:center;font-size:11.5px;margin:12px 0 0">Free express shipping · 24h delivery in Athens</p>`;}
  function openDrawer(){drawerEl();renderDrawer();document.getElementById('drip-mask').classList.add('open');document.getElementById('drip-drawer').classList.add('open');}
  function closeDrawer(){document.getElementById('drip-mask')?.classList.remove('open');document.getElementById('drip-drawer')?.classList.remove('open');}
  function toggleSearch(){let el=document.getElementById('drip-search');if(el){el.remove();return;}el=document.createElement('div');el.id='drip-search';
    el.style='position:fixed;inset:0;z-index:92;background:rgba(3,3,4,.92);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;padding-top:14vh';
    el.innerHTML=`<div class="wrap" style="width:100%;max-width:720px"><input id="drip-si" placeholder="Search ${DATA.length} sneakers…" autofocus style="width:100%;background:none;border:none;border-bottom:2px solid var(--accent);color:#fff;font-family:var(--font-display);text-transform:uppercase;font-size:clamp(26px,5vw,46px);padding:14px 0;outline:none"><div id="drip-sr" style="margin-top:24px;max-height:52vh;overflow:auto"></div></div>`;
    el.addEventListener('click',e=>{if(e.target===el)el.remove()});document.body.appendChild(el);const inp=document.getElementById('drip-si');inp.focus();
    inp.addEventListener('input',()=>{const q=inp.value.trim().toLowerCase();const r=document.getElementById('drip-sr');if(q.length<2){r.innerHTML='';return;}
      const list=DATA.filter(p=>(p.name+' '+p.brand).toLowerCase().includes(q)).slice(0,8);
      r.innerHTML=list.length?list.map(p=>`<a href="#/product/${p.slug}" onclick="document.getElementById('drip-search').remove()" style="display:flex;gap:14px;align-items:center;padding:12px;border-radius:14px"><img src="${p.images[0]}" style="width:54px;height:54px;object-fit:contain;background:#fff;border-radius:9px;padding:5px"><div><div style="font-size:14px">${p.name}</div><div class="muted" style="font-size:12px">${p.brand} · ${money(p.price)}</div></div></a>`).join(''):`<p class="muted">No matches for "${q}".</p>`;});
    document.addEventListener('keydown',function k(e){if(e.key==='Escape'){el.remove();document.removeEventListener('keydown',k);}});}
  function card(p){const off=p.compareAtPrice?Math.round((1-p.price/p.compareAtPrice)*100):0;
    const badge=p.badge?`<span class="badge ${p.badge}">${p.badge==='sale'?'-'+off+'%':p.badge}</span>`:'';
    const sw=(p.colors||[]).slice(0,4).map(c=>`<span class="swatch" style="background:${c.hex}" title="${esc(c.name)}"></span>`).join('');
    return `<article class="card"><div class="frame">${badge}<button class="wish" onclick="event.preventDefault();DRIP.toast('Saved to wishlist ♡')">${icon('heart')}</button><a href="#/product/${p.slug}" aria-label="${esc(p.name)}"><img loading="lazy" src="${p.images[0]}" alt="${esc(p.name)}"></a><a class="quick" href="#/product/${p.slug}">Quick View ${icon('arrow')}</a></div><div class="meta"><div class="brandline">${p.brand}</div><a href="#/product/${p.slug}"><div class="name">${p.name}</div></a><div class="priceline"><span class="price">${money(p.price)}</span>${p.compareAtPrice?`<span class="compare">${money(p.compareAtPrice)}</span><span class="off">-${off}%</span>`:''}</div>${sw?`<div class="swatches">${sw}</div>`:''}</div></article>`;}
  let toastT;function toast(m){let t=document.getElementById('drip-toast');if(!t){t=document.createElement('div');t.id='drip-toast';t.className='toast';document.body.appendChild(t);}t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);}
  function mountChrome(active){document.getElementById('hdr').innerHTML=header(active);document.getElementById('ftr').innerHTML=footer();paintCount();}
  function spin360(el,frames,opts){opts=opts||{};frames.forEach(s=>{const i=new Image();i.src=s;});let idx=0,auto=opts.auto!==false,dragging=false,lastX=0,acc=0;const N=frames.length;const show=i=>{idx=((i%N)+N)%N;el.src=frames[idx];};show(0);const timer=setInterval(()=>{if(auto&&!dragging)show(idx+1);},opts.speed||85);const px=e=>e.touches?e.touches[0].clientX:e.clientX;const down=e=>{dragging=true;lastX=px(e);auto=false;el.style.cursor='grabbing';};const move=e=>{if(!dragging)return;const x=px(e);acc+=x-lastX;lastX=x;const step=(el.clientWidth||320)/N;while(Math.abs(acc)>=step){show(idx+(acc>0?1:-1));acc+=acc>0?-step:step;}};const up=()=>{if(!dragging)return;dragging=false;el.style.cursor='grab';clearTimeout(up._t);up._t=setTimeout(()=>{auto=(opts.auto!==false);},2200);};el.addEventListener('mousedown',down);el.addEventListener('touchstart',down,{passive:true});addEventListener('mousemove',move);addEventListener('touchmove',move,{passive:true});addEventListener('mouseup',up);addEventListener('touchend',up);return{stop:()=>clearInterval(timer)};}
  return {money,products,cart,card,icon,mountChrome,openDrawer,closeDrawer,renderDrawer,toggleSearch,toast,esc,spin360};
})();

/* ================= ROUTER + VIEWS ================= */
(function(){
  const app=()=>document.getElementById('app');
  const D=DRIP.products();
  const byImg=p=>p.images&&p.images[0];

  function parseHash(){
    let h=location.hash.replace(/^#/,'')||'/';
    const qi=h.indexOf('?');const path=qi>=0?h.slice(0,qi):h;const q=qi>=0?h.slice(qi+1):'';
    return {path,params:new URLSearchParams(q)};
  }

  /* ---------- HOME ---------- */
  function home(){
    DRIP.mountChrome('Home');
    const heroes=(D.filter(p=>p.featured&&byImg(p)).slice(0,6).length>=3?D.filter(p=>p.featured&&byImg(p)).slice(0,6):D.filter(byImg).slice(0,5));
    const brands=META.brands;
    const cover={};D.forEach(p=>{if(!cover[p.brand]&&byImg(p))cover[p.brand]=p.images[0];});
    const newA=D.filter(p=>p.categories.includes('new-arrivals')&&byImg(p)).slice(0,8);
    const best=D.filter(p=>p.featured&&byImg(p)).slice(0,8);
    const sale=D.filter(p=>p.compareAtPrice&&byImg(p)).slice(0,10);
    const dropP=D.filter(p=>p.compareAtPrice&&byImg(p)).sort((a,b)=>(1-b.price/b.compareAtPrice)-(1-a.price/a.compareAtPrice))[0]||heroes[0];
    const off=dropP.compareAtPrice?Math.round((1-dropP.price/dropP.compareAtPrice)*100):0;
    const names=brands.map(b=>b.name);
    app().innerHTML=`
    <section class="hero"><div class="wrap"><div class="hero-grid">
      <div class="hero-copy">
        <span class="hero-tag"><i></i> Summer Drop · Live Now</span>
        <h1><span class="out">We don't</span><br>sell sneakers.<br>We sell <span class="accent">culture.</span></h1>
        <p class="lead">Athens' destination for authenticated luxury sneakers &amp; streetwear. ${D.length} grails in the vault — Air Jordan, Nike, Yeezy, New Balance &amp; more. Hand-checked, sealed, delivered in 24 hours.</p>
        <div class="hero-cta"><a class="btn-fill" href="#/shop">Shop the vault ${DRIP.icon('arrow')}</a><a class="btn-line" href="#/shop?c=new-arrivals">New arrivals</a></div>
        <div class="hero-stats"><div><b>${D.length}</b><span>Styles in stock</span></div><div><b>${brands.length}</b><span>Premium brands</span></div><div><b>24h</b><span>Athens delivery</span></div></div>
      </div>
      <div><div class="hero-stage" id="heroStage"><div class="glow"></div><div class="ring"></div><div class="ring r2"></div><div class="hero-cap">Hot right now</div><div class="hero-slides" id="heroSlides"></div><a class="hero-label" id="heroLabel" href="#/"></a><div class="hero-dots" id="heroDots"></div></div></div>
    </div></div></section>
    <div class="marquee"><div class="track">${'<span>'+names.concat(names).join('</span><span>')+'</span>'}</div></div>
    <section class="sec"><div class="wrap reveal"><div class="trust-strip">
      <div class="t">${DRIP.icon('truck')}<div><b>24h Delivery</b><span>Free across Athens</span></div></div>
      <div class="t">${DRIP.icon('shield')}<div><b>100% Authentic</b><span>Verified by hand</span></div></div>
      <div class="t">${DRIP.icon('arrow')}<div><b>Easy Returns</b><span>14-day window</span></div></div>
      <div class="t">${DRIP.icon('bag')}<div><b>Secure Checkout</b><span>All major cards</span></div></div>
    </div></div></section>
    <section class="sec"><div class="wrap reveal"><div class="sec-head"><div><div class="eyebrow">The houses</div><h2>Shop by brand</h2></div><a class="more" href="#/shop?view=brands">All brands ${DRIP.icon('arrow')}</a></div>
      <div class="brand-rail">${brands.slice(0,6).map(b=>`<a class="brand-tile" href="#/shop?brand=${encodeURIComponent(b.name)}"><img loading="lazy" src="${cover[b.name]}" alt="${b.name}"><div class="bn">${b.name} · ${b.count}</div></a>`).join('')}</div></div></section>
    <section class="sec"><div class="wrap reveal"><div class="sec-head"><div><div class="eyebrow">Fresh off the truck</div><h2>New arrivals</h2></div><a class="more" href="#/shop?c=new-arrivals">View all ${DRIP.icon('arrow')}</a></div><div class="grid">${newA.map(DRIP.card).join('')}</div></div></section>
    <section class="sec"><div class="wrap reveal"><div class="drop"><a class="d-img" href="#/product/${dropP.slug}"><img loading="lazy" src="${dropP.images[0]}" alt="${DRIP.esc(dropP.name)}"></a><div class="d-copy"><div class="eyebrow">Drop of the week${off?' · -'+off+'%':''}</div><h3>${dropP.name}</h3><p>${dropP.description||''}</p><div class="d-price"><span class="p">${DRIP.money(dropP.price)}</span>${dropP.compareAtPrice?`<span class="c">${DRIP.money(dropP.compareAtPrice)}</span>`:''}</div><div style="margin-top:10px"><a class="btn-fill" href="#/product/${dropP.slug}">Cop now</a></div></div></div></div></section>
    <section class="sec"><div class="wrap reveal"><div class="sec-head"><div><div class="eyebrow">Most wanted</div><h2>Best sellers</h2></div><a class="more" href="#/shop?c=featured">View all ${DRIP.icon('arrow')}</a></div><div class="grid">${best.map(DRIP.card).join('')}</div></div></section>
    <section class="sec"><div class="wrap reveal"><div class="sec-head"><div><div class="eyebrow" style="color:#ff8198">Grails, marked down</div><h2>On sale</h2></div><a class="more" href="#/shop?c=sale">All deals ${DRIP.icon('arrow')}</a></div><div class="rail">${sale.map(DRIP.card).join('')}</div></div></section>
    <section class="sec"><div class="wrap reveal"><div class="news"><h2>Join the inner circle</h2><p>Early access to drops, restocks and members-only pricing. No noise — just heat.</p><form onsubmit="event.preventDefault();DRIP.toast('You are on the list ✦');this.reset()"><input type="email" required placeholder="your@email.com"><button class="btn-fill" type="submit">Subscribe</button></form></div></div></section>`;
    // hero: single-sneaker auto-rotating slideshow (one transparent cutout at a time)
    const slides=(SHOWCASE||[]).map(s=>{const p=D.find(x=>x.slug===s.slug)||{};return {slug:s.slug,img:s.img,name:s.name||p.name||'',brand:s.brand||p.brand||'',price:s.price!=null?s.price:p.price};}).filter(s=>s.img);
    const slidesEl=document.getElementById('heroSlides'),dotsEl=document.getElementById('heroDots'),labelEl=document.getElementById('heroLabel'),stage=document.getElementById('heroStage');
    if(slides.length){
      slidesEl.innerHTML=slides.map((s,i)=>`<a class="hero-slide${i===0?' on':''}" href="#/product/${s.slug}"><img src="${s.img}" alt="${DRIP.esc(s.name)}" draggable="false"></a>`).join('');
      dotsEl.innerHTML=slides.map((s,i)=>`<button type="button" aria-label="Show ${DRIP.esc(s.name)}"${i===0?' class="on"':''}></button>`).join('');
      const slideEls=[...slidesEl.children],dotEls=[...dotsEl.children];
      let cur=0,timer;
      const paint=i=>{cur=((i%slides.length)+slides.length)%slides.length;slideEls.forEach((el,j)=>el.classList.toggle('on',j===cur));dotEls.forEach((el,j)=>el.classList.toggle('on',j===cur));const s=slides[cur];labelEl.href='#/product/'+s.slug;labelEl.innerHTML=`<div><div class="br">${DRIP.esc(s.brand)}</div><div class="nm">${DRIP.esc(s.name)}</div></div>${s.price!=null?`<span class="pr">${DRIP.money(s.price)}</span>`:''}`;};
      const start=()=>{clearInterval(timer);if(slides.length>1)timer=setInterval(()=>paint(cur+1),3800);};
      dotEls.forEach((d,i)=>d.addEventListener('click',e=>{e.preventDefault();paint(i);start();}));
      stage.addEventListener('mouseenter',()=>clearInterval(timer));
      stage.addEventListener('mouseleave',start);
      paint(0);start();
    }
    reveal();
  }

  /* ---------- SHOP ---------- */
  const CATL={sneakers:'Sneakers',running:'Running',basketball:'Basketball',lifestyle:'Lifestyle',clothing:'Clothing',accessories:'Accessories','new-arrivals':'New Arrivals',sale:'Sale','limited-editions':'Limited Editions',featured:'Best Sellers',trending:'Trending'};
  function shop(params){
    DRIP.mountChrome('Shop');
    const PAGE=48;let shown=0,view=[];
    const st={cat:params.get('c')||'',brands:new Set(params.get('brand')?[params.get('brand')]:[]),sizes:new Set(),pmin:null,pmax:null,instock:false,q:params.get('q')||'',sort:'featured'};
    const isBrands=params.get('view')==='brands';
    const matchCat=(p,c)=>!c?true:c==='featured'?p.featured:c==='trending'?p.trending:(p.categories||[]).includes(c);
    let title='Shop All',sub='Every pair in the vault — authenticated, ready to ship.';
    if(st.cat&&CATL[st.cat]){title=CATL[st.cat];sub='';}
    if(st.brands.size){title=[...st.brands][0];sub='';}
    if(isBrands){title='Brands';sub='The houses we carry — tap a brand to shop its collection.';}
    app().innerHTML=`
    <div class="wrap page-head"><div class="crumbs"><a href="#/">Home</a> / <span>${title}</span></div><h1 class="display page-title">${title}</h1>${sub?`<p class="page-sub">${sub}</p>`:''}</div>
    ${isBrands?`<div class="wrap" style="padding-bottom:80px"><div id="brandsView" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px"></div></div>`:`
    <div class="wrap"><div class="toolbar"><div class="result-count"><b id="rc">0</b> products</div><div class="tool-right">
      <button class="btn-filter" onclick="document.querySelector('.filters').classList.add('open')">Filters</button>
      <label class="search-box">${DRIP.icon('search')}<input id="q" type="search" placeholder="Search in results…" value="${DRIP.esc(st.q)}"></label>
      <select class="select" id="sort"><option value="featured">Featured</option><option value="new">Newest</option><option value="price-asc">Price: Low → High</option><option value="price-desc">Price: High → Low</option><option value="discount">Biggest Discount</option><option value="name">Name A–Z</option></select>
    </div></div></div>
    <div class="wrap shop-layout"><aside class="filters"><div class="filter-close"><button onclick="document.querySelector('.filters').classList.remove('open')">✕</button></div>
      <div class="fgroup"><h4>Category</h4><div id="fcat"></div></div>
      <div class="fgroup"><h4>Brand</h4><div id="fbrand"></div></div>
      <div class="fgroup"><h4>Size (EU)</h4><div class="size-grid" id="fsize"></div></div>
      <div class="fgroup"><h4>Price</h4><div class="price-row"><input id="pmin" type="number" placeholder="Min"><span class="muted">—</span><input id="pmax" type="number" placeholder="Max"></div></div>
      <div class="fgroup" style="border:0"><label class="fopt"><input type="checkbox" id="instock"> In stock only</label></div>
      <button class="clear-all" id="clear">Clear all filters</button></aside>
      <main><div id="grid" class="grid"></div><div class="loadmore-row" id="lm" style="display:none"><button class="btn-load" id="more">Load more</button></div><div class="empty" id="empty" style="display:none"><h3>No matches</h3><p>Try removing a filter.</p></div></main>
    </div>`}`;
    if(isBrands){const cover={};D.forEach(p=>{if(!cover[p.brand]&&byImg(p))cover[p.brand]=p.images[0];});
      document.getElementById('brandsView').innerHTML=META.brands.map(b=>`<a class="card" href="#/shop?brand=${encodeURIComponent(b.name)}"><div class="frame" style="aspect-ratio:4/3"><img loading="lazy" src="${cover[b.name]||D[0].images[0]}" alt="${b.name}"><div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;z-index:2;background:linear-gradient(transparent,rgba(0,0,0,.5))"><div class="display" style="font-size:24px;color:#fff">${b.name}</div><div style="font-size:12px;color:rgba(255,255,255,.7)">${b.count} styles</div></div></div></a>`).join('');
      reveal();return;}
    // filters
    const catEl=document.getElementById('fcat');const cs=['',...Object.keys(CATL)];
    catEl.innerHTML=cs.map(c=>{const n=c?D.filter(p=>matchCat(p,c)).length:D.length;if(c&&!n)return'';return `<label class="fopt" data-v="${c}"><input type="radio" name="cat" ${c===st.cat?'checked':''} style="border-radius:50%" onchange="__shopSetCat('${c}')"><span>${c?CATL[c]:'All'}</span><span class="c">${n}</span></label>`}).join('');
    const bc={};D.forEach(p=>bc[p.brand]=(bc[p.brand]||0)+1);
    document.getElementById('fbrand').innerHTML=Object.entries(bc).sort((a,b)=>b[1]-a[1]).map(([b,n])=>`<label class="fopt" data-v="${DRIP.esc(b)}"><input type="checkbox" ${st.brands.has(b)?'checked':''} onchange="__shopBrand('${b.replace(/'/g,"\\'")}',this.checked)"><span>${b}</span><span class="c">${n}</span></label>`).join('');
    const sz=new Set();D.forEach(p=>(p.sizes||[]).forEach(s=>sz.add(String(s))));const sorted=[...sz].filter(s=>/^\d/.test(s)).sort((a,b)=>parseFloat(a)-parseFloat(b)).concat([...sz].filter(s=>!/^\d/.test(s)));
    document.getElementById('fsize').innerHTML=sorted.map(s=>`<button onclick="__shopSize(this,'${s.replace(/'/g,"\\'")}')">${s}</button>`).join('');
    function apply(){view=D.filter(p=>{if(!matchCat(p,st.cat))return false;if(st.brands.size&&!st.brands.has(p.brand))return false;if(st.sizes.size&&!(p.sizes||[]).some(s=>st.sizes.has(String(s))))return false;if(st.pmin!=null&&p.price<st.pmin)return false;if(st.pmax!=null&&p.price>st.pmax)return false;if(st.instock&&!p.inStock)return false;if(st.q){const t=(p.name+' '+p.brand).toLowerCase();if(!t.includes(st.q.toLowerCase()))return false;}return true;});
      const s=st.sort;view.sort((a,b)=>s==='price-asc'?a.price-b.price:s==='price-desc'?b.price-a.price:s==='name'?a.name.localeCompare(b.name):s==='new'?new Date(b.releaseDate)-new Date(a.releaseDate):s==='discount'?((b.compareAtPrice?1-b.price/b.compareAtPrice:0)-(a.compareAtPrice?1-a.price/a.compareAtPrice:0)):((b.featured-a.featured)||(b.trending-a.trending)||(b.rating-a.rating)));
      document.getElementById('rc').textContent=view.length;shown=0;document.getElementById('grid').innerHTML='';document.getElementById('empty').style.display=view.length?'none':'block';more();
      document.querySelectorAll('#fbrand .fopt').forEach(el=>el.classList.toggle('active',st.brands.has(el.dataset.v)));}
    function more(){const next=view.slice(shown,shown+PAGE);document.getElementById('grid').insertAdjacentHTML('beforeend',next.map(DRIP.card).join(''));shown+=next.length;document.getElementById('lm').style.display=shown<view.length?'flex':'none';}
    window.__shopSetCat=c=>{st.cat=c;apply();window.scrollTo({top:0,behavior:'smooth'});};
    window.__shopBrand=(b,ch)=>{ch?st.brands.add(b):st.brands.delete(b);apply();};
    window.__shopSize=(el,s)=>{st.sizes.has(s)?st.sizes.delete(s):st.sizes.add(s);el.classList.toggle('active');apply();};
    document.getElementById('q').addEventListener('input',e=>{st.q=e.target.value;apply();});
    document.getElementById('sort').addEventListener('change',e=>{st.sort=e.target.value;apply();});
    const pf=()=>{st.pmin=+document.getElementById('pmin').value||null;st.pmax=+document.getElementById('pmax').value||null;apply();};
    document.getElementById('pmin').addEventListener('input',pf);document.getElementById('pmax').addEventListener('input',pf);
    document.getElementById('instock').addEventListener('change',e=>{st.instock=e.target.checked;apply();});
    document.getElementById('more').addEventListener('click',more);
    document.getElementById('clear').addEventListener('click',()=>{location.hash='#/shop';});
    apply();
  }

  /* ---------- PRODUCT ---------- */
  function product(handle){
    DRIP.mountChrome('Shop');
    const p=D.find(x=>x.slug===handle);
    if(!p){app().innerHTML=`<div class="wrap"><div class="empty"><h3>Product not found</h3><p><a href="#/shop" style="color:var(--accent)">Back to shop →</a></p></div></div>`;return;}
    const off=p.compareAtPrice?Math.round((1-p.price/p.compareAtPrice)*100):0;
    const imgs=p.images&&p.images.length?p.images:[p.images[0]];
    const swatches=(p.colors||[]).map((c,i)=>`<button class="swatch-big ${i===0?'active':''}" onclick="__pickColor(this)"><i style="background:${c.hex}"></i>${c.name}</button>`).join('');
    const sizes=(p.sizes||[]).map(s=>`<button onclick="__pickSize(this,'${String(s).replace(/'/g,"\\'")}')">${s}</button>`).join('')||'<p class="muted" style="font-size:13px">One size</p>';
    let rel=D.filter(x=>x.slug!==p.slug&&x.brand===p.brand);if(rel.length<4)rel=rel.concat(D.filter(x=>x.slug!==p.slug&&x.category===p.category&&x.brand!==p.brand));rel=rel.slice(0,4);
    app().innerHTML=`
    <div class="wrap" style="position:relative;z-index:2;padding-top:26px"><div class="crumbs"><a href="#/">Home</a> / <a href="#/shop">Shop</a> / <a href="#/shop?brand=${encodeURIComponent(p.brand)}">${p.brand}</a> / <span class="muted">${p.name}</span></div></div>
    <div class="wrap pdp"><div class="gallery">${imgs.length>1?`<div class="thumbs">${imgs.map((s,i)=>`<button class="thumb ${i===0?'active':''}" onclick="__setPic(${i})"><img src="${s}" alt=""></button>`).join('')}</div>`:''}<div class="main-img"><img id="mainpic" src="${imgs[0]}" alt="${DRIP.esc(p.name)}"></div></div>
      <div class="pinfo"><div class="brandline">${p.brand}</div><h1>${p.name}</h1>
        <div class="rating" style="font-size:13px">★★★★★ <span class="muted">${(p.rating||4.8).toFixed?p.rating.toFixed(1):p.rating} · ${p.reviews||120} reviews</span></div>
        <div class="pricewrap"><span class="price">${DRIP.money(p.price)}</span>${p.compareAtPrice?`<span class="compare">${DRIP.money(p.compareAtPrice)}</span><span class="off">-${off}%</span>`:''}</div>
        <div class="tax">Incl. VAT · Free express shipping</div>
        ${swatches?`<div class="block"><div class="lab">Colour</div><div class="swatch-row">${swatches}</div></div>`:''}
        <div class="block"><div class="lab">Select Size (EU)<a href="#/" onclick="event.preventDefault();DRIP.toast('Order your usual EU size ✦')" style="color:var(--accent);text-transform:none;letter-spacing:0">Size guide</a></div><div class="sizes" id="sizes">${sizes}</div><div class="size-hint" id="sizehint"></div></div>
        <div class="buyrow"><button class="btn-primary" onclick="__addBag()">Add to Bag — ${DRIP.money(p.price)}</button><button class="btn-ghost" onclick="DRIP.toast('Saved to wishlist ♡')">${DRIP.icon('heart')}</button></div>
        <div class="trust"><div>${DRIP.icon('truck')} 24h delivery in Athens</div><div>${DRIP.icon('shield')} 100% authenticated</div><div>${DRIP.icon('arrow')} 14-day returns</div></div>
        <div class="accord" style="margin-top:26px"><details open><summary>Description</summary><div class="body">${p.description||''}</div></details><details><summary>Materials &amp; Build</summary><div class="body">${p.materials||'Premium materials.'}</div></details><details><summary>Shipping &amp; Returns</summary><div class="body">Free insured express shipping across Greece, 24h in Athens. EU delivery 2–4 days. 14-day returns on unworn pairs.</div></details><details><summary>Authenticity</summary><div class="body">Every pair is inspected and authenticated before dispatch, with a verification tag included.</div></details></div>
      </div></div>
    ${rel.length?`<div class="wrap"><h2 class="section-title">You may also like</h2><div class="grid">${rel.map(DRIP.card).join('')}</div></div>`:''}`;
    window.__setPic=i=>{document.getElementById('mainpic').src=imgs[i];document.querySelectorAll('.thumb').forEach((t,j)=>t.classList.toggle('active',j===i));};
    let chosen=null;
    window.__pickSize=(el,s)=>{chosen=s;document.querySelectorAll('#sizes button').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.getElementById('sizehint').textContent='';};
    window.__pickColor=el=>{document.querySelectorAll('.swatch-big').forEach(b=>b.classList.remove('active'));el.classList.add('active');};
    window.__addBag=()=>{if((p.sizes||[]).length&&!chosen){document.getElementById('sizehint').textContent='Please select a size first.';return;}DRIP.cart.add({slug:p.slug,name:p.name,brand:p.brand,price:p.price,image:imgs[0],size:chosen||'OS'});};
    window.scrollTo(0,0);reveal();
  }

  function reveal(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.1});document.querySelectorAll('.reveal').forEach(el=>io.observe(el));}

  function route(){const {path,params}=parseHash();window.scrollTo(0,0);
    if(path==='/'||path===''){home();}
    else if(path==='/shop'){shop(params);}
    else if(path.indexOf('/product/')===0){product(decodeURIComponent(path.slice(9)));}
    else{home();}}
  window.addEventListener('hashchange',route);
  route();
})();
</script>
</body>
</html>

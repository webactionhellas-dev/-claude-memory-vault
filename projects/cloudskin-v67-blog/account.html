<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/img/brand/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>(function(){try{if(sessionStorage.getItem('cs_gate_ok')==='1')return;}catch(e){return;}location.replace('/');})();</script>
  <title>My Account | CLOUDSKIN&reg;</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f4ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/main.css?v=67">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap">
  <style>
    /* ============================================================
       CLOUDSKIN account  -  "Concierge" design system
       Built on the storefront tokens from main.css:
       warm-neutral ramp, ink type, hairline borders, SHARP corners
       (radius 0, the brand signature). One restrained antique-gold
       accent is used ONLY for the active-tab indicator + focus ring.
       Everything else stays in the brand's warm-neutral palette.
       ============================================================ */
    .account {
      /* local aliases mirror the live main.css tokens (with fallbacks) */
      --pa: #f7f4ef; --white: #ffffff; --oat: #efeae1; --sand: #e5ddd0;
      --ink: #171512; --graphite: #2c2925; --slate: #55504a;
      --stone: #857d72; --mist: #b4ab9f; --line: #e6e0d6; --line2: #d8d0c3;
      --ok: #4a7a5a; --acc: #a8874e;               /* antique-gold accent */
      --ease: cubic-bezier(.22,1,.36,1);
      background: var(--paper, #f7f4ef);
      color: var(--ink, #171512);
      min-height: 78vh;
      -webkit-font-smoothing: antialiased;
    }
    .account__wrap { max-width: 1160px; margin: 0 auto; padding: clamp(28px,4vw,56px) clamp(18px,4vw,44px) clamp(64px,8vw,104px); }

    /* ---- Header -------------------------------------------------- */
    .account__head {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 22px;
      border-bottom: 1px solid var(--line);
      padding-bottom: clamp(22px,3vw,30px);
    }
    .account__intro { flex: 1; min-width: 0; }
    .account__eyebrow {
      font-family: var(--sans,'Inter',sans-serif);
      font-size: 11px; font-weight: 600; letter-spacing: .2em;
      text-transform: uppercase; color: var(--stone); margin: 0 0 14px;
    }
    .account__title {
      font-family: 'Archivo', var(--sans,sans-serif); font-weight: 300;
      font-size: clamp(30px,6vw,50px); line-height: 1.0; letter-spacing: -.016em;
      margin: 0; color: var(--ink);
    }
    .account__email {
      font-family: var(--sans,'Inter',sans-serif); font-size: 14px;
      color: var(--slate); margin: 12px 0 0; word-break: break-word;
    }
    .account__signout {
      flex: 0 0 auto; appearance: none; cursor: pointer;
      background: var(--white); color: var(--ink);
      border: 1px solid var(--line2); border-radius: 0;
      padding: 12px 22px; min-height: 44px;
      font-family: var(--sans,'Inter',sans-serif); font-size: 11px;
      font-weight: 600; letter-spacing: .15em; text-transform: uppercase;
      transition: background .22s var(--ease), color .22s var(--ease), border-color .22s var(--ease);
    }
    .account__signout:hover { background: var(--ink); color: var(--white); border-color: var(--ink); }

    /* ---- At-a-glance stat strip (real, derived data only) -------- */
    .account__stats {
      display: grid; grid-template-columns: repeat(3,1fr);
      background: var(--white); border: 1px solid var(--line);
      margin-top: clamp(22px,3vw,30px);
    }
    .stat { padding: clamp(16px,2.4vw,22px) clamp(16px,2.4vw,24px); border-left: 1px solid var(--line); }
    .stat:first-child { border-left: 0; }
    .stat__n {
      font-family: 'Archivo', var(--sans,sans-serif); font-weight: 400;
      font-size: clamp(22px,3.4vw,30px); line-height: 1; color: var(--ink);
      letter-spacing: -.01em;
    }
    .stat__l {
      font-family: var(--sans,'Inter',sans-serif); font-size: 10.5px;
      font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
      color: var(--stone); margin-top: 8px; line-height: 1.35;
    }

    /* ---- Layout: sidebar tabs + panels -------------------------- */
    .account__grid {
      display: grid; grid-template-columns: 214px 1fr;
      gap: clamp(28px,4.5vw,64px); align-items: start;
      margin-top: clamp(28px,4vw,44px);
    }
    .account__side { position: sticky; top: 104px; }
    .account__tablist { display: flex; flex-direction: column; gap: 2px; }
    .account__tab {
      position: relative; appearance: none; cursor: pointer;
      display: flex; align-items: center; gap: 10px; width: 100%;
      background: transparent; border: 0;
      border-radius: 0; text-align: left;
      padding: 13px 14px 13px 16px; min-height: 46px;
      font-family: var(--sans,'Inter',sans-serif); font-size: 14px;
      font-weight: 500; letter-spacing: .01em; color: var(--slate);
      transition: color .2s var(--ease), background .2s var(--ease);
    }
    /* gold active indicator as a background bar (renders reliably vs a button border) */
    .account__tab::before {
      content: ""; position: absolute; left: 0; top: 9px; bottom: 9px;
      width: 2px; background: transparent; transition: background .2s var(--ease);
    }
    .account__tab:hover { color: var(--ink); background: rgba(0,0,0,.02); }
    .account__tab.is-on { color: var(--ink); background: var(--white); }
    .account__tab.is-on::before { background: var(--acc); }
    .account__tab-label { flex: 1; }
    .account__tab-badge {
      font-family: var(--sans,'Inter',sans-serif); font-size: 11px; font-weight: 600;
      letter-spacing: .04em; color: var(--stone);
      min-width: 20px; height: 20px; padding: 0 6px; border-radius: 0;
      background: var(--oat); display: inline-flex; align-items: center; justify-content: center;
    }
    .account__tab.is-on .account__tab-badge { background: var(--sand); color: var(--ink); }
    .account__tab-badge:empty { display: none; }

    /* ---- Panels -------------------------------------------------- */
    .account__section { display: none; }
    .account__section.is-active { display: block; animation: acFade .28s var(--ease); }
    @keyframes acFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .account__h {
      font-family: var(--sans,'Inter',sans-serif); font-size: 12px; font-weight: 600;
      letter-spacing: .16em; text-transform: uppercase; color: var(--stone);
      margin: 0 0 20px; padding-bottom: 15px; border-bottom: 1px solid var(--line);
    }
    .account__loading {
      font-family: var(--sans,'Inter',sans-serif); font-size: 14px;
      color: var(--stone); margin: 0; padding: 6px 0;
    }

    /* ---- Order cards -------------------------------------------- */
    .order {
      background: var(--white); border: 1px solid var(--line); border-radius: 0;
      padding: clamp(18px,2.4vw,22px) clamp(18px,2.6vw,24px); margin-bottom: 14px;
    }
    .order__top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px 18px; flex-wrap: wrap; }
    .order__no { font-family: 'Archivo', var(--sans,sans-serif); font-weight: 500; font-size: 15px; letter-spacing: .01em; color: var(--ink); }
    .order__date { font-family: var(--sans,'Inter',sans-serif); font-size: 12.5px; color: var(--stone); white-space: nowrap; }
    .order__items { font-family: var(--sans,'Inter',sans-serif); font-size: 13px; color: var(--slate); margin: 12px 0 0; line-height: 1.55; }
    .order__foot {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px 18px; flex-wrap: wrap;
      margin-top: 16px; padding-top: 15px; border-top: 1px solid var(--line);
    }
    .order__status { display: inline-flex; align-items: center; gap: 9px; font-family: var(--sans,'Inter',sans-serif); font-size: 12.5px; color: var(--slate); }
    .order__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mist); flex: 0 0 auto; }
    .order__dot--on { background: var(--ok); }
    .order__total { font-family: var(--sans,'Inter',sans-serif); font-size: 14px; font-weight: 500; color: var(--ink); }
    .order__track {
      display: inline-flex; align-items: center; gap: 7px; margin-top: 6px;
      min-height: 44px; padding: 6px 0;      /* comfortable tap target */
      font-family: var(--sans,'Inter',sans-serif); font-size: 11px; font-weight: 600;
      letter-spacing: .12em; text-transform: uppercase; color: var(--ink);
      text-decoration: none; transition: opacity .2s var(--ease);
    }
    .order__track-txt { border-bottom: 1px solid var(--ink); padding-bottom: 3px; }
    .order__track:hover { opacity: .55; }
    .order__track svg { width: 13px; height: 13px; }

    /* ---- Detail rows -------------------------------------------- */
    .acc-rows { border-top: 1px solid var(--line); }
    .acc-row {
      display: flex; justify-content: space-between; gap: 18px;
      padding: 16px 2px; border-bottom: 1px solid var(--line);
      font-family: var(--sans,'Inter',sans-serif); font-size: 14px;
    }
    .acc-row__k { color: var(--stone); letter-spacing: .01em; }
    .acc-row__v { color: var(--ink); text-align: right; word-break: break-word; }

    /* ---- Wishlist grid ------------------------------------------ */
    .acc-wish { display: grid; grid-template-columns: repeat(auto-fill,minmax(150px,1fr)); gap: 18px; }
    .acc-wish__card { text-decoration: none; display: block; }
    .acc-wish__img { position: relative; overflow: hidden; background: var(--oat); }
    .acc-wish__img img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; transition: transform .5s var(--ease); }
    .acc-wish__card:hover .acc-wish__img img { transform: scale(1.035); }
    .acc-wish__t { font-family: var(--sans,'Inter',sans-serif); font-size: 13px; color: var(--ink); margin: 10px 0 2px; }
    .acc-wish__p { font-family: var(--sans,'Inter',sans-serif); font-size: 12.5px; color: var(--slate); }

    /* ---- Inviting empty states ---------------------------------- */
    .acc-empty {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      background: var(--white); border: 1px solid var(--line); border-radius: 0;
      padding: clamp(40px,7vw,68px) clamp(22px,5vw,40px);
    }
    .acc-empty__mark { width: 46px; height: 46px; color: var(--mist); margin-bottom: 22px; }
    .acc-empty__mark svg { width: 100%; height: 100%; }
    .acc-empty__t { font-family: 'Archivo', var(--sans,sans-serif); font-weight: 400; font-size: clamp(19px,2.6vw,23px); letter-spacing: -.01em; color: var(--ink); margin: 0 0 10px; }
    .acc-empty__p { font-family: var(--sans,'Inter',sans-serif); font-size: 14px; line-height: 1.6; color: var(--slate); margin: 0 auto 26px; max-width: 34ch; }
    .acc-btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 46px; padding: 14px 30px; border-radius: 0;
      background: var(--ink); color: var(--white);
      border: 1px solid var(--ink); text-decoration: none;
      font-family: var(--sans,'Inter',sans-serif); font-size: 11.5px; font-weight: 600;
      letter-spacing: .16em; text-transform: uppercase;
      transition: background .22s var(--ease), color .22s var(--ease);
    }
    .acc-btn:hover { background: transparent; color: var(--ink); }

    /* ---- Focus (keyboard) --------------------------------------- */
    .account a:focus-visible,
    .account button:focus-visible,
    .account__tab:focus-visible {
      outline: 2px solid var(--acc); outline-offset: 2px;
    }

    /* ============================================================
       MOBILE  -  the headline requirement. Sidebar tabs become a
       sticky segmented control; everything full-width + comfortable.
       ============================================================ */
    @media (max-width: 760px) {
      .account__grid { grid-template-columns: 1fr; gap: 0; margin-top: 22px; }
      .account__side {
        position: sticky; top: var(--header-h, 72px); z-index: 20;
        margin: 0 0 22px;
        /* solid bleed so panels scroll cleanly under the control */
        padding-top: 10px; margin-top: -10px;
        background: var(--paper, #f7f4ef);
      }
      .account__tablist {
        flex-direction: row; gap: 4px;
        background: var(--oat); border: 1px solid var(--line); padding: 5px;
      }
      .account__tab {
        flex: 1 1 0; min-width: 0; justify-content: center; text-align: center;
        gap: 0; padding: 13px 6px; min-height: 48px;
        font-size: 13px; font-weight: 500;
      }
      .account__tab::before { display: none; }   /* left bar is desktop-only */
      .account__tab:hover { background: transparent; }
      .account__tab.is-on { background: var(--white); box-shadow: 0 1px 2px rgba(23,21,18,.05); }
      .account__tab.is-on::after {
        content: ""; position: absolute; left: 14px; right: 14px; bottom: 7px;
        height: 2px; background: var(--acc);
      }
      .account__tab-badge { display: none; }
    }
    @media (max-width: 560px) {
      .account__head { flex-direction: column; align-items: stretch; gap: 18px; }
      .account__signout { align-self: flex-start; padding: 11px 20px; }
      .stat { padding: 15px 12px; }
      .stat__l { font-size: 9.5px; letter-spacing: .1em; }
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .account__section.is-active { animation: none; }
      .acc-wish__img img, .account__tab, .account__signout, .acc-btn, .order__track { transition: none; }
    }
  </style>
</head>
<body id="top">
  <div class="grain" aria-hidden="true"></div>
  <div id="site-header"></div>

  <main class="account">
    <div class="account__wrap">

      <header class="account__head">
        <div class="account__intro">
          <p class="account__eyebrow">Your account</p>
          <h1 class="account__title" id="acHello">My account</h1>
          <p class="account__email" id="acEmail"></p>
        </div>
        <button class="account__signout" id="acSignOut" type="button">Sign out</button>
      </header>

      <!-- At-a-glance strip: real, derived counts only (Mike: judgment call, flagged) -->
      <div class="account__stats" aria-label="Account summary">
        <div class="stat"><div class="stat__n" id="acStatOrders">-</div><div class="stat__l">Orders</div></div>
        <div class="stat"><div class="stat__n" id="acStatWish">-</div><div class="stat__l">Saved pieces</div></div>
        <div class="stat"><div class="stat__n" id="acStatSince">-</div><div class="stat__l">Member since</div></div>
      </div>

      <div class="account__grid">
        <aside class="account__side">
          <div class="account__tablist" role="tablist" aria-label="Account sections">
            <button class="account__tab is-on" id="tab-orders" role="tab" data-tab="orders" aria-selected="true" aria-controls="orders" tabindex="0" type="button">
              <span class="account__tab-label">Orders</span><span class="account__tab-badge" id="acCountOrders"></span>
            </button>
            <button class="account__tab" id="tab-details" role="tab" data-tab="details" aria-selected="false" aria-controls="details" tabindex="-1" type="button">
              <span class="account__tab-label">Details</span>
            </button>
            <button class="account__tab" id="tab-wishlist" role="tab" data-tab="wishlist" aria-selected="false" aria-controls="wishlist" tabindex="-1" type="button">
              <span class="account__tab-label">Wishlist</span><span class="account__tab-badge" id="acCountWish"></span>
            </button>
          </div>
        </aside>

        <div class="account__panels">
          <section class="account__section is-active" id="orders" role="tabpanel" aria-labelledby="tab-orders" tabindex="0">
            <h2 class="account__h">Your orders</h2>
            <div id="acOrders"><p class="account__loading">Loading your orders&hellip;</p></div>
          </section>

          <section class="account__section" id="details" role="tabpanel" aria-labelledby="tab-details" tabindex="0">
            <h2 class="account__h">Details</h2>
            <div class="acc-rows">
              <div class="acc-row"><span class="acc-row__k">Name</span><span class="acc-row__v" id="acName">-</span></div>
              <div class="acc-row"><span class="acc-row__k">Email</span><span class="acc-row__v" id="acEmailVal">-</span></div>
              <div class="acc-row"><span class="acc-row__k">Member since</span><span class="acc-row__v" id="acSince">-</span></div>
            </div>
          </section>

          <section class="account__section" id="wishlist" role="tabpanel" aria-labelledby="tab-wishlist" tabindex="0">
            <h2 class="account__h">Wishlist</h2>
            <div id="acWish"><p class="account__loading">Loading your wishlist&hellip;</p></div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer" aria-label="Footer"></footer>

  <script src="js/i18n-strings.js?v=67"></script>
  <script src="js/i18n.js?v=67"></script>
  <script src="js/config.js?v=67"></script>
  <script src="js/products.js?v=67"></script>
  <script src="js/shopify.js?v=67"></script>
  <script src="js/curate.js?v=67"></script>
  <script src="js/legal.js?v=67"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=67"></script>
  <script src="js/content-snapshot.js?v=67"></script>
  <script src="js/auth.js?v=67"></script>
  <script src="js/shell.js?v=67"></script>
  <script src="js/checkout.js?v=67"></script>
  <script src="js/lux.js?v=67" defer></script>
  <script>
  (function () {
    var C = window.CLOUDSKIN || {};
    var $ = function (id) { return document.getElementById(id); };
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function toLogin() { location.replace('login.html'); }

    if (!C.sb) { toLogin(); return; }   // accounts not configured -> the login page explains

    // Only render for a real signed-in session; otherwise send to sign in.
    C.sb.auth.getSession().then(function (r) {
      var user = r && r.data && r.data.session && r.data.session.user;
      if (!user) { toLogin(); return; }
      renderAccount(user);
    }).catch(toLogin);
    // If the session ends (sign out here or in another tab), leave the account page.
    C.sb.auth.onAuthStateChange(function (_e, session) { if (!session) toLogin(); });

    function renderAccount(user) {
      var name = (user.user_metadata && user.user_metadata.full_name) || '';
      $('acHello').textContent = name ? ('Welcome back, ' + name.split(' ')[0]) : 'Welcome back';
      $('acEmail').textContent = user.email || '';
      $('acName').textContent = name || '-';
      $('acEmailVal').textContent = user.email || '-';
      // Member since  -  long form in Details, short form in the stat strip.
      try {
        if (user.created_at) {
          var d = new Date(user.created_at);
          $('acSince').textContent = d.toLocaleDateString(undefined, { year: 'numeric', month: 'long' });
          $('acStatSince').textContent = d.toLocaleDateString(undefined, { year: 'numeric', month: 'short' });
        }
      } catch (e) {}
      loadOrders();
      renderWishlist();
    }

    // Real Shopify orders via Supabase (RLS scopes rows to the signed-in email).
    // Until an order exists, a clean inviting empty state  -  never fake data.
    function loadOrders() {
      var body = $('acOrders');
      function empty() {
        $('acStatOrders').textContent = '0';
        $('acCountOrders').textContent = '';
        body.innerHTML =
          '<div class="acc-empty">' +
            '<div class="acc-empty__mark">' + ICON_BAG + '</div>' +
            '<h3 class="acc-empty__t">No orders yet</h3>' +
            '<p class="acc-empty__p">When you place your first order, it lives here with every detail and live tracking.</p>' +
            '<a class="acc-btn" href="collection.html">Explore the collection</a>' +
          '</div>';
      }
      if (!C.sb) { empty(); return; }
      // Read the customer's own Shopify orders from customer_orders. RLS returns only
      // rows whose email matches the signed-in account, so no token juggling is needed.
      C.sb.from('customer_orders')
        .select('shopify_order_id,order_name,processed_at,currency,total_price,financial_status,fulfillment_status,line_items,tracking')
        .order('processed_at', { ascending: false })
        .then(function (r) {
          if (r.error || !r.data || !r.data.length) { empty(); return; }
          $('acStatOrders').textContent = String(r.data.length);
          $('acCountOrders').textContent = String(r.data.length);
          body.innerHTML = r.data.map(orderCard).join('');
        }, empty);
    }
    function orderCard(o) {
      var status = String(o.fulfillment_status || '');
      var on = /fulfilled|shipped|delivered|complete/i.test(status);
      var statusLabel = on ? 'Shipped' : (status ? (status.charAt(0).toUpperCase() + status.slice(1)) : 'Processing');
      var date = '';
      try { date = o.processed_at ? new Date(o.processed_at).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : ''; } catch (e) {}
      var li = Array.isArray(o.line_items) ? o.line_items : [];
      var items = li.map(function (it) { return esc(it.title || '') + (it.quantity > 1 ? ' ×' + it.quantity : ''); }).filter(Boolean).join(', ');
      var total = '';
      if (o.total_price != null) { var cur = o.currency === 'EUR' ? '€' : (o.currency ? o.currency + ' ' : ''); total = cur + Number(o.total_price).toFixed(2); }
      var track = (o.tracking && o.tracking.url)
        ? '<a class="order__track" href="' + esc(o.tracking.url) + '" target="_blank" rel="noopener">' + ICON_TRACK + '<span class="order__track-txt">Track shipment</span></a>'
        : '';
      return '<div class="order">' +
        '<div class="order__top"><span class="order__no">' + esc(o.order_name || ('#' + o.shopify_order_id)) + '</span><span class="order__date">' + esc(date) + '</span></div>' +
        (items ? '<p class="order__items">' + items + '</p>' : '') +
        '<div class="order__foot"><span class="order__status"><span class="order__dot' + (on ? ' order__dot--on' : '') + '"></span>' + esc(statusLabel) + '</span><span class="order__total">' + esc(total) + '</span></div>' +
        track + '</div>';
    }

    function renderWishlist() {
      var box = $('acWish'); if (!box) return;
      function empty() {
        $('acStatWish').textContent = '0';
        $('acCountWish').textContent = '';
        box.innerHTML =
          '<div class="acc-empty">' +
            '<div class="acc-empty__mark">' + ICON_HEART + '</div>' +
            '<h3 class="acc-empty__t">Nothing saved yet</h3>' +
            '<p class="acc-empty__p">Tap the heart on any piece to keep it here, ready when you are.</p>' +
            '<a class="acc-btn" href="collection.html">Browse the collection</a>' +
          '</div>';
      }
      try {
        if (!C.wishlist) { empty(); return; }
        var handles = (typeof C.wishlist.all === 'function') ? C.wishlist.all() : (C.wishlist.list ? C.wishlist.list() : []);
        if (!handles || !handles.length) { empty(); return; }
        var prods = window.CLOUDSKIN_PRODUCTS || [];
        var cards = handles.map(function (h) {
          var p = prods.find(function (x) { return x.handle === h; }); if (!p) return '';
          var img = (C.baseImageFor && C.baseImageFor(p)) || p.shopifyFeatured || (p.images && p.images[0]) || '';
          var price = C.money ? C.money(p.price, true) : ('€' + p.price);
          return '<a class="acc-wish__card" href="product.html?handle=' + encodeURIComponent(h) + '">' +
                   '<span class="acc-wish__img"><img src="' + esc(img) + '" alt="' + esc(p.title) + '" loading="lazy"></span>' +
                   '<div class="acc-wish__t">' + esc(p.title) + '</div><div class="acc-wish__p">' + esc(price) + '</div></a>';
        }).filter(Boolean).join('');
        if (cards) {
          $('acStatWish').textContent = String(handles.length);
          $('acCountWish').textContent = String(handles.length);
          box.innerHTML = '<div class="acc-wish">' + cards + '</div>';
        } else {
          empty();
        }
      } catch (e) { empty(); }
    }

    $('acSignOut').addEventListener('click', function () {
      var done = function () { location.replace('home.html'); };
      if (C.auth && C.auth.signOut) C.auth.signOut().then(done, done);
      else C.sb.auth.signOut().then(done, done);
    });

    // ---- Tabs: one accessible tablist, restyled per breakpoint ----
    var tabs = [].slice.call(document.querySelectorAll('.account__tab'));
    var order = ['orders', 'details', 'wishlist'];
    function activate(id, moveFocus) {
      tabs.forEach(function (t) {
        var isOn = t.getAttribute('data-tab') === id;
        t.classList.toggle('is-on', isOn);
        t.setAttribute('aria-selected', isOn ? 'true' : 'false');
        t.setAttribute('tabindex', isOn ? '0' : '-1');
        if (isOn && moveFocus) t.focus();
      });
      order.forEach(function (k) {
        var sec = document.getElementById(k);
        if (sec) sec.classList.toggle('is-active', k === id);
      });
    }
    tabs.forEach(function (t) {
      t.addEventListener('click', function () { activate(t.getAttribute('data-tab')); });
      t.addEventListener('keydown', function (e) {
        var idx = order.indexOf(t.getAttribute('data-tab'));
        var next = null;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (idx + 1) % order.length;
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (idx - 1 + order.length) % order.length;
        else if (e.key === 'Home') next = 0;
        else if (e.key === 'End') next = order.length - 1;
        if (next !== null) { e.preventDefault(); activate(order[next], true); }
      });
    });
    activate('orders');

    // Inline SVG marks (stroke = currentColor, so they inherit the muted tone)
    var ICON_BAG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 8h13l-1 12.5h-11L5.5 8Z"/><path d="M9 8.5V6.5a3 3 0 0 1 6 0v2"/></svg>';
    var ICON_HEART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.2-4.6-9.6-9.2C1 8.1 2.6 4.6 6.1 4.6c2 0 3.3 1.2 3.9 2.4.6-1.2 1.9-2.4 3.9-2.4 3.5 0 5.1 3.5 3.7 6.7C19.2 15.9 12 20.5 12 20.5Z"/></svg>';
    var ICON_TRACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h11v10H4z"/><path d="M15 10h3.5L21 12.5V17h-6"/><circle cx="7.5" cy="17.5" r="1.6"/><circle cx="16.5" cy="17.5" r="1.6"/></svg>';
  })();
  </script>
</body>
